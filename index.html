<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoFin</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Heebo',sans-serif;background:#F4F3EF;color:#0B1F3A;direction:rtl}
.nav{background:#0B1F3A;height:64px;display:flex;align-items:center;padding:0 2rem;position:sticky;top:0;z-index:100}
.logo{color:#C9A84C;font-size:1.6rem;font-weight:900;cursor:pointer}
.logo em{color:white;font-style:normal}
.wrap{max-width:1240px;margin:0 auto;padding:2rem}
h1{font-size:2rem;margin-bottom:2rem;font-weight:900}
.cars{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:2rem}
.car{background:white;border-radius:16px;overflow:hidden;border:1px solid #E0DEDA;transition:transform .3s,box-shadow .3s;cursor:pointer}
.car:hover{transform:translateY(-6px);box-shadow:0 12px 32px rgba(0,0,0,.12)}
.car-img{width:100%;height:220px;object-fit:cover;background:#ddd;display:block}
.car-info{padding:1.5rem}
.car-name{font-size:1.2rem;font-weight:800;margin-bottom:.4rem}
.car-meta{font-size:.85rem;color:#5A6A7E;margin-bottom:.8rem}
.car-price{font-size:1.5rem;font-weight:900;color:#0B1F3A}
.car-badge{display:inline-block;background:#E8F5E9;color:#1A7A4A;padding:2px 10px;border-radius:20px;font-size:.75rem;font-weight:600;margin-top:.5rem}
.img-count{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.6);color:white;padding:3px 10px;border-radius:20px;font-size:.75rem}
.car-thumb{position:relative}
.loading{text-align:center;padding:4rem;font-size:1.2rem;color:#5A6A7E}

/* MODAL */
.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);z-index:1000;justify-content:center;align-items:flex-start;padding:2rem;overflow-y:auto;backdrop-filter:blur(4px)}
.modal-overlay.active{display:flex}
.modal{background:white;border-radius:20px;max-width:900px;width:100%;overflow:hidden;animation:modalIn .4s ease;position:relative;margin:auto}
@keyframes modalIn{from{opacity:0;transform:translateY(40px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
.modal-close{position:absolute;top:16px;right:16px;width:40px;height:40px;background:rgba(0,0,0,.5);border:none;border-radius:50%;color:white;font-size:24px;cursor:pointer;z-index:10;display:flex;align-items:center;justify-content:center;transition:background .2s}
.modal-close:hover{background:rgba(0,0,0,.8)}

/* MODAL GALLERY */
.modal-gallery{position:relative;width:100%;height:400px;background:#111;overflow:hidden}
.modal-gallery img{width:100%;height:100%;object-fit:contain;display:block;transition:opacity .3s}
.modal-arrow{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;background:rgba(255,255,255,.9);border:none;border-radius:50%;cursor:pointer;font-size:22px;font-weight:bold;color:#0B1F3A;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 12px rgba(0,0,0,.2);transition:all .2s;z-index:5}
.modal-arrow:hover{background:white;transform:translateY(-50%) scale(1.1)}
.modal-arrow.right{right:12px}
.modal-arrow.left{left:12px}
.modal-counter{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.6);color:white;padding:4px 14px;border-radius:20px;font-size:.85rem}
.modal-thumbs{display:flex;gap:6px;padding:12px;background:#f5f5f5;overflow-x:auto}
.modal-thumbs img{width:70px;height:50px;object-fit:cover;border-radius:6px;cursor:pointer;opacity:.5;transition:all .2s;border:2px solid transparent;flex-shrink:0}
.modal-thumbs img.active{opacity:1;border-color:#C9A84C}
.modal-thumbs img:hover{opacity:.8}

/* MODAL BODY */
.modal-body{padding:2rem}
.modal-name{font-size:1.8rem;font-weight:900;margin-bottom:.5rem;animation:fadeUp .5s ease .1s both}
.modal-meta-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-bottom:1.5rem;animation:fadeUp .5s ease .2s both}
.meta-item{background:#F4F3EF;border-radius:12px;padding:1rem;text-align:center}
.meta-item .label{font-size:.75rem;color:#5A6A7E;margin-bottom:.3rem}
.meta-item .value{font-size:1.1rem;font-weight:700}
.modal-desc{font-size:1rem;line-height:1.8;color:#444;margin-bottom:1.5rem;padding:1.2rem;background:#FAFAFA;border-radius:12px;border-right:4px solid #C9A84C;animation:fadeUp .5s ease .3s both}
.modal-price-row{display:flex;align-items:center;gap:1rem;margin-bottom:1.5rem;animation:fadeUp .5s ease .35s both}
.modal-price{font-size:2rem;font-weight:900;color:#0B1F3A}

.modal-finance{background:#F4F3EF;border-radius:16px;padding:1.5rem;animation:fadeUp .5s ease .4s both}
.modal-finance h3{font-size:1.1rem;font-weight:700;margin-bottom:1rem}
.mf-label{font-size:.85rem;color:#5A6A7E;margin-bottom:.5rem;display:flex;justify-content:space-between}
.mf-slider{width:100%;-webkit-appearance:none;appearance:none;height:8px;background:linear-gradient(90deg,#C9A84C 50%,#E0DEDA 50%);border-radius:4px;outline:none;cursor:pointer;margin-bottom:1rem}
.mf-slider::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#C9A84C;cursor:pointer;border:3px solid #0B1F3A;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.mf-result{display:flex;justify-content:space-between;align-items:center;padding:1rem;background:white;border-radius:12px}
.mf-monthly{font-size:1.6rem;font-weight:900;color:#C9A84C}
.mf-total{font-size:.85rem;color:#999}

.modal-cta{width:100%;padding:16px;background:#C9A84C;color:#0B1F3A;border:none;border-radius:12px;font-size:1.1rem;font-weight:800;cursor:pointer;margin-top:1.5rem;transition:all .2s;animation:fadeUp .5s ease .5s both}
.modal-cta:hover{background:#d9b558;transform:scale(1.02)}

@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

@media(max-width:600px){
  .modal-gallery{height:280px}
  .modal-meta-grid{grid-template-columns:repeat(2,1fr)}
  .modal-body{padding:1.2rem}
  .cars{grid-template-columns:1fr}
}
</style>
</head>
<body>
<nav class="nav">
  <div class="logo" onclick="location.reload()"><em>Auto</em>Fin</div>
</nav>

<div class="wrap">
  <h1>&#x1F697; &#x05E7;&#x05D8;&#x05DC;&#x05D5;&#x05D2; &#x05E8;&#x05DB;&#x05D1;&#x05D9;&#x05DD;</h1>
  <div id="cars" class="loading">&#x05D8;&#x05D5;&#x05E2;&#x05DF;...</div>
</div>

<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script>
firebase.initializeApp({
  apiKey:"AIzaSyCUC4ConlLR7nONsqECFc_8S5_rO9oiwuQ",
  authDomain:"car-sales-7ddec.firebaseapp.com",
  databaseURL:"https://car-sales-7ddec-default-rtdb.firebaseio.com",
  projectId:"car-sales-7ddec",
  storageBucket:"car-sales-7ddec.firebasestorage.app",
  messagingSenderId:"360924922585",
  appId:"1:360924922585:web:0f18b076fff3e82460f4c8"
});
var db = firebase.database();
var allCars = {};
var modalIdx = 0;
var modalImages = [];

function fmt(n){return Math.round(n).toLocaleString('he-IL')}
function pmt(p,m,r){var i=r/100/12;if(i===0)return p/m;return p*(i*Math.pow(1+i,m))/(Math.pow(1+i,m)-1)}

db.ref('cars').on('value',function(snap){
  var data=snap.val();
  var c=document.getElementById('cars');
  if(!data){c.innerHTML='<p style="text-align:center;color:#999;padding:3rem">&#x05D0;&#x05D9;&#x05DF; &#x05E8;&#x05DB;&#x05D1;&#x05D9;&#x05DD;</p>';return}
  allCars=data;
  var h='<div class="cars">';
  var keys=Object.keys(data);
  for(var i=0;i<keys.length;i++){
    var car=data[keys[i]];
    var imgs=car.images||[];
    if(imgs.length===0&&car.image_url)imgs=[car.image_url];
    var price=parseInt(car.price)||0;
    h+='<div class="car" onclick="openModal(\''+keys[i]+'\')">';
    h+='<div class="car-thumb">';
    if(imgs.length>0)h+='<img src="'+imgs[0]+'" alt="'+car.name+'" class="car-img">';
    if(imgs.length>1)h+='<span class="img-count">'+imgs.length+' &#x05EA;&#x05DE;&#x05D5;&#x05E0;&#x05D5;&#x05EA;</span>';
    h+='</div>';
    h+='<div class="car-info">';
    h+='<div class="car-name">'+(car.name||'')+'</div>';
    h+='<div class="car-meta">'+(car.year||'')+' &middot; '+(car.engine||'')+' &middot; '+fmt(car.km||0)+' &#x05E7;"&#x05DE;</div>';
    h+='<div class="car-price">'+fmt(price)+' &#8362;</div>';
    if(car.description)h+='<div class="car-badge">&#x05DC;&#x05D7;&#x05E5; &#x05DC;&#x05E4;&#x05E8;&#x05D8;&#x05D9;&#x05DD;</div>';
    h+='</div></div>';
  }
  h+='</div>';
  c.className='';c.innerHTML=h;
});

function openModal(key){
  var car=allCars[key];if(!car)return;
  modalImages=car.images||[];
  if(modalImages.length===0&&car.image_url)modalImages=[car.image_url];
  modalIdx=0;
  var price=parseInt(car.price)||0;
  var defM=36;var defPMT=pmt(price,defM,5);

  var h='<button class="modal-close" onclick="closeModal()">&#x2715;</button>';
  
  h+='<div class="modal-gallery" id="mgal">';
  h+='<img id="mimg" src="'+(modalImages[0]||'')+'" alt="">';
  if(modalImages.length>1){
    h+='<button class="modal-arrow right" onclick="mSlide(1)">&#8249;</button>';
    h+='<button class="modal-arrow left" onclick="mSlide(-1)">&#8250;</button>';
    h+='<div class="modal-counter" id="mcounter">1 / '+modalImages.length+'</div>';
  }
  h+='</div>';

  if(modalImages.length>1){
    h+='<div class="modal-thumbs" id="mthumbs">';
    for(var i=0;i<modalImages.length;i++){
      h+='<img src="'+modalImages[i]+'" onclick="mGo('+i+')" class="'+(i===0?'active':'')+'">';
    }
    h+='</div>';
  }

  h+='<div class="modal-body">';
  h+='<div class="modal-name">'+(car.name||'')+'</div>';
  
  h+='<div class="modal-meta-grid">';
  h+='<div class="meta-item"><div class="label">&#x05E9;&#x05E0;&#x05D4;</div><div class="value">'+(car.year||'')+'</div></div>';
  h+='<div class="meta-item"><div class="label">&#x05DE;&#x05E0;&#x05D5;&#x05E2;</div><div class="value">'+(car.engine||'')+'</div></div>';
  h+='<div class="meta-item"><div class="label">&#x05E7;"&#x05DE;</div><div class="value">'+fmt(car.km||0)+'</div></div>';
  h+='</div>';

  if(car.description){
    h+='<div class="modal-desc">'+car.description+'</div>';
  }

  h+='<div class="modal-price-row">';
  h+='<div class="modal-price">'+fmt(price)+' &#8362;</div>';
  h+='</div>';

  h+='<div class="modal-finance">';
  h+='<h3>&#x05DE;&#x05D7;&#x05E9;&#x05D1;&#x05D5;&#x05DF; &#x05DE;&#x05D9;&#x05DE;&#x05D5;&#x05DF; (5% &#x05E8;&#x05D9;&#x05D1;&#x05D9;&#x05EA;)</h3>';
  h+='<div class="mf-label"><span>&#x05EA;&#x05E7;&#x05D5;&#x05E4;&#x05D4;</span><span id="mm">'+defM+' &#x05D7;&#x05D5;&#x05D3;&#x05E9;&#x05D9;&#x05DD;</span></div>';
  h+='<input type="range" min="1" max="60" value="'+defM+'" class="mf-slider" id="mslider" oninput="mCalc('+price+')">';
  h+='<div class="mf-result">';
  h+='<div class="mf-monthly" id="mpmt">'+fmt(defPMT)+' &#8362; / &#x05D7;&#x05D5;&#x05D3;&#x05E9;</div>';
  h+='<div class="mf-total" id="mtotal">&#x05E1;&#x05D4;"&#x05DB;: '+fmt(defPMT*defM)+' &#8362;</div>';
  h+='</div></div>';

  h+='<button class="modal-cta" onclick="alert(\'&#x05D1;&#x05E7;&#x05E8;&#x05D5;&#x05D1; - &#x05D8;&#x05D5;&#x05E4;&#x05E1; &#x05D9;&#x05E6;&#x05D9;&#x05E8;&#x05EA; &#x05E7;&#x05E9;&#x05E8;\')">&#x05D0;&#x05E0;&#x05D9; &#x05DE;&#x05E2;&#x05D5;&#x05E0;&#x05D9;&#x05D9;&#x05DF; - &#x05E6;&#x05E8;&#x05D5; &#x05E7;&#x05E9;&#x05E8;</button>';
  h+='</div>';

  document.getElementById('modal').innerHTML=h;
  document.getElementById('modalOverlay').classList.add('active');
  document.body.style.overflow='hidden';
}

function closeModal(){
  document.getElementById('modalOverlay').classList.remove('active');
  document.body.style.overflow='';
}

function mSlide(dir){
  modalIdx+=dir;
  if(modalIdx<0)modalIdx=modalImages.length-1;
  if(modalIdx>=modalImages.length)modalIdx=0;
  mUpdate();
}

function mGo(i){modalIdx=i;mUpdate()}

function mUpdate(){
  document.getElementById('mimg').src=modalImages[modalIdx];
  var cnt=document.getElementById('mcounter');
  if(cnt)cnt.innerHTML=(modalIdx+1)+' / '+modalImages.length;
  var thumbs=document.querySelectorAll('#mthumbs img');
  for(var i=0;i<thumbs.length;i++){thumbs[i].className=i===modalIdx?'active':''}
}

function mCalc(price){
  var m=parseInt(document.getElementById('mslider').value);
  var p=pmt(price,m,5);
  document.getElementById('mpmt').innerHTML=fmt(p)+' &#8362; / &#x05D7;&#x05D5;&#x05D3;&#x05E9;';
  document.getElementById('mm').innerHTML=m+' &#x05D7;&#x05D5;&#x05D3;&#x05E9;&#x05D9;&#x05DD;';
  document.getElementById('mtotal').innerHTML='&#x05E1;&#x05D4;"&#x05DB;: '+fmt(p*m)+' &#8362;';
  var pct=(m/60)*100;
  document.getElementById('mslider').style.background='linear-gradient(90deg,#C9A84C '+pct+'%,#E0DEDA '+pct+'%)';
}

document.addEventListener('keydown',function(e){
  if(!document.getElementById('modalOverlay').classList.contains('active'))return;
  if(e.key==='Escape')closeModal();
  if(e.key==='ArrowRight')mSlide(-1);
  if(e.key==='ArrowLeft')mSlide(1);
});
</script>
</body>
</html>
