<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoFin</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Heebo',sans-serif;background:#F4F3EF;color:#0B1F3A;direction:rtl}
body.noscroll{overflow:hidden}
.nav{background:#0B1F3A;height:64px;display:flex;align-items:center;padding:0 2rem;position:sticky;top:0;z-index:100}
.logo{color:#C9A84C;font-size:1.6rem;font-weight:900;cursor:pointer}
.logo em{color:white;font-style:normal}
.wrap{max-width:1240px;margin:0 auto;padding:2rem}
h1{font-size:2rem;margin-bottom:2rem;font-weight:900}
.cars{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:2rem}
.car{background:white;border-radius:16px;overflow:hidden;border:1px solid #E0DEDA;transition:transform .3s,box-shadow .3s}
.car:hover{transform:translateY(-6px);box-shadow:0 12px 32px rgba(0,0,0,.12)}
.cg{position:relative;width:100%;height:220px;overflow:hidden;background:#ddd;cursor:pointer}
.cg img{width:100%;height:100%;object-fit:cover;display:block}
.ca{position:absolute;top:50%;transform:translateY(-50%);width:32px;height:32px;background:rgba(255,255,255,.85);border:none;border-radius:50%;cursor:pointer;font-size:16px;font-weight:bold;color:#0B1F3A;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.15);z-index:2;opacity:0;transition:opacity .2s}
.car:hover .ca{opacity:1}
.ca.r{right:8px}.ca.l{left:8px}
.cdots{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:4px;z-index:2}
.cdt{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.5);border:none;cursor:pointer;padding:0}.cdt.on{background:#C9A84C}
.ic{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.6);color:white;padding:2px 10px;border-radius:20px;font-size:.75rem;z-index:2}
.ci{padding:1.2rem}
.cn{font-size:1.15rem;font-weight:800;margin-bottom:.3rem;cursor:pointer}
.cm{font-size:.85rem;color:#5A6A7E;margin-bottom:.6rem}
.cp{font-size:1.4rem;font-weight:900;color:#0B1F3A;margin-bottom:1rem}

/* CARD SLIDER */
.fb{background:#F4F3EF;border-radius:10px;padding:.8rem 1rem;margin-top:.5rem}
.fl{font-size:.75rem;color:#5A6A7E;margin-bottom:.4rem;display:flex;justify-content:space-between}
.fs{width:100%;-webkit-appearance:none;appearance:none;height:5px;background:#E0DEDA;border-radius:3px;outline:none;cursor:pointer}
.fs::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#C9A84C;cursor:pointer;border:2px solid #0B1F3A}
.fr{display:flex;justify-content:space-between;align-items:center;margin-top:.5rem}
.fpm{font-size:1.15rem;font-weight:900;color:#C9A84C}
.ftot{font-size:.7rem;color:#999}

.cb{display:inline-block;background:#E8F5E9;color:#1A7A4A;padding:2px 10px;border-radius:20px;font-size:.75rem;font-weight:600;margin-top:.6rem;cursor:pointer}
.loading{text-align:center;padding:4rem;font-size:1.2rem;color:#5A6A7E}

/* MODAL */
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:1000;padding:16px;backdrop-filter:blur(3px)}
.ov.active{display:flex;justify-content:center;align-items:center}
.ml{background:white;border-radius:14px;width:100%;max-width:700px;max-height:calc(100vh - 32px);display:flex;flex-direction:column;overflow:hidden;animation:mIn .3s ease;position:relative}
@keyframes mIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
.mx{position:absolute;top:8px;right:8px;width:32px;height:32px;background:rgba(0,0,0,.5);border:none;border-radius:50%;color:white;font-size:16px;cursor:pointer;z-index:10;display:flex;align-items:center;justify-content:center}
.mx:hover{background:rgba(0,0,0,.8)}
.mg{position:relative;width:100%;height:280px;background:#222;overflow:hidden;flex-shrink:0}
.mg img{width:100%;height:100%;object-fit:cover;display:block}
.ma{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;background:rgba(255,255,255,.9);border:none;border-radius:50%;cursor:pointer;font-size:18px;font-weight:bold;color:#0B1F3A;display:flex;align-items:center;justify-content:center;z-index:5}
.ma:hover{transform:translateY(-50%) scale(1.1)}
.ma.r{right:8px}.ma.l{left:8px}
.mcn{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.55);color:white;padding:2px 10px;border-radius:14px;font-size:.75rem}
.mth{display:flex;gap:4px;padding:6px 8px;background:#f0f0f0;overflow-x:auto;flex-shrink:0}
.mth img{width:48px;height:36px;object-fit:cover;border-radius:4px;cursor:pointer;opacity:.4;transition:all .2s;border:2px solid transparent;flex-shrink:0}
.mth img.a{opacity:1;border-color:#C9A84C}
.mbd{padding:1rem 1.2rem 1.2rem;overflow-y:auto;flex:1}
.mn{font-size:1.3rem;font-weight:900;margin-bottom:.5rem;animation:fu .3s ease both}
.mmg{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-bottom:.8rem;animation:fu .3s ease .05s both}
.mi{background:#F4F3EF;border-radius:8px;padding:.5rem;text-align:center}
.mi .lb{font-size:.65rem;color:#5A6A7E;margin-bottom:.1rem}
.mi .vl{font-size:.85rem;font-weight:700}
.md{font-size:.85rem;line-height:1.6;color:#444;margin-bottom:.8rem;padding:.7rem;background:#FAFAFA;border-radius:8px;border-right:3px solid #C9A84C;animation:fu .3s ease .1s both}
.mp{font-size:1.4rem;font-weight:900;color:#0B1F3A;margin-bottom:.8rem;animation:fu .3s ease .15s both}
.mfin{background:#F4F3EF;border-radius:10px;padding:.8rem;animation:fu .3s ease .2s both}
.mfin h3{font-size:.85rem;font-weight:700;margin-bottom:.5rem}
.mfl2{font-size:.75rem;color:#5A6A7E;margin-bottom:.3rem;display:flex;justify-content:space-between}
.ms2{width:100%;-webkit-appearance:none;appearance:none;height:5px;background:#E0DEDA;border-radius:3px;outline:none;cursor:pointer;margin-bottom:.5rem}
.ms2::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#C9A84C;cursor:pointer;border:2px solid #0B1F3A}
.mr2{display:flex;justify-content:space-between;align-items:center;padding:.5rem .7rem;background:white;border-radius:8px}
.mrm2{font-size:1.1rem;font-weight:900;color:#C9A84C}
.mrt2{font-size:.7rem;color:#999}
.mcta{width:100%;padding:11px;background:#C9A84C;color:#0B1F3A;border:none;border-radius:8px;font-size:.9rem;font-weight:800;cursor:pointer;margin-top:.8rem;transition:all .2s;animation:fu .3s ease .25s both}
.mcta:hover{background:#d9b558}
@keyframes fu{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

@media(max-width:768px){
  .wrap{padding:1rem}
  h1{font-size:1.5rem;margin-bottom:1.2rem}
  .cars{grid-template-columns:1fr;gap:1.2rem}
  .ov{padding:8px}
  .mg{height:200px}
  .mbd{padding:.8rem}
  .mn{font-size:1.1rem}
  .mp{font-size:1.2rem}
}
</style>
</head>
<body>
<nav class="nav"><div class="logo" onclick="location.reload()"><em>Auto</em>Fin</div></nav>
<div class="wrap">
  <h1>&#x1F697; &#x05E7;&#x05D8;&#x05DC;&#x05D5;&#x05D2; &#x05E8;&#x05DB;&#x05D1;&#x05D9;&#x05DD;</h1>
  <div id="cars" class="loading">&#x05D8;&#x05D5;&#x05E2;&#x05DF;...</div>
</div>
<div class="ov" id="ov" onclick="if(event.target===this)cl()"><div class="ml" id="ml"></div></div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script>
firebase.initializeApp({apiKey:"AIzaSyCUC4ConlLR7nONsqECFc_8S5_rO9oiwuQ",authDomain:"car-sales-7ddec.firebaseapp.com",databaseURL:"https://car-sales-7ddec-default-rtdb.firebaseio.com",projectId:"car-sales-7ddec",storageBucket:"car-sales-7ddec.firebasestorage.app",messagingSenderId:"360924922585",appId:"1:360924922585:web:0f18b076fff3e82460f4c8"});
var db=firebase.database(),AC={},CS={},mi=0,mI=[];
function F(n){return Math.round(n).toLocaleString('he-IL')}
function P(p,m,r){var i=r/100/12;return i===0?p/m:p*(i*Math.pow(1+i,m))/(Math.pow(1+i,m)-1)}

function cS(id,d,e){e.stopPropagation();var s=CS[id];if(!s)return;s.i+=d;if(s.i<0)s.i=s.g.length-1;if(s.i>=s.g.length)s.i=0;document.getElementById('ci-'+id).src=s.g[s.i];var dots=document.querySelectorAll('.cd-'+id+' .cdt');for(var j=0;j<dots.length;j++)dots[j].className=j===s.i?'cdt on':'cdt'}

function uC(id,pr,val){
  var m=parseInt(val),p=P(pr,m,5);
  document.getElementById('fp-'+id).innerHTML=F(p)+' &#8362; / &#x05D7;&#x05D5;&#x05D3;&#x05E9;';
  document.getElementById('fm-'+id).innerHTML=m+' &#x05D7;&#x05D5;&#x05D3;&#x05E9;&#x05D9;&#x05DD;';
  document.getElementById('ft-'+id).innerHTML='&#x05E1;&#x05D4;"&#x05DB;: '+F(p*m)+' &#8362;';
}

db.ref('cars').on('value',function(snap){
  var data=snap.val(),c=document.getElementById('cars');
  if(!data){c.innerHTML='<p style="text-align:center;color:#999;padding:3rem">&#x05D0;&#x05D9;&#x05DF; &#x05E8;&#x05DB;&#x05D1;&#x05D9;&#x05DD;</p>';return}
  AC=data;var h='<div class="cars">',K=Object.keys(data);
  for(var i=0;i<K.length;i++){
    var car=data[K[i]],id=K[i].replace(/[^a-zA-Z0-9]/g,''),imgs=car.images||[];
    if(!imgs.length&&car.image_url)imgs=[car.image_url];
    CS[id]={i:0,g:imgs};var pr=parseInt(car.price)||0;
    var dm=36,dp=P(pr,dm,5);

    h+='<div class="car">';
    h+='<div class="cg" onclick="op(\''+K[i]+'\')">';
    if(imgs.length)h+='<img id="ci-'+id+'" src="'+imgs[0]+'" alt="">';
    if(imgs.length>1){
      h+='<button class="ca r" onclick="cS(\''+id+'\',1,event)">&#8249;</button>';
      h+='<button class="ca l" onclick="cS(\''+id+'\',-1,event)">&#8250;</button>';
      h+='<span class="ic">'+imgs.length+' &#x05EA;&#x05DE;&#x05D5;&#x05E0;&#x05D5;&#x05EA;</span>';
      h+='<div class="cdots cd-'+id+'">';
      for(var d=0;d<imgs.length;d++)h+='<button class="cdt'+(d===0?' on':'')+'" onclick="event.stopPropagation()"></button>';
      h+='</div>';
    }
    h+='</div><div class="ci">';
    h+='<div class="cn" onclick="op(\''+K[i]+'\')">'+(car.name||'')+'</div>';
    h+='<div class="cm">'+(car.year||'')+' &middot; '+(car.engine||'')+' &middot; '+F(car.km||0)+' &#x05E7;"&#x05DE;</div>';
    h+='<div class="cp">'+F(pr)+' &#8362;</div>';

    h+='<div class="fb">';
    h+='<div class="fl"><span>&#x05DE;&#x05D9;&#x05DE;&#x05D5;&#x05DF; &#x05D7;&#x05D5;&#x05D3;&#x05E9;&#x05D9; (5% &#x05E8;&#x05D9;&#x05D1;&#x05D9;&#x05EA;)</span><span id="fm-'+id+'">'+dm+' &#x05D7;&#x05D5;&#x05D3;&#x05E9;&#x05D9;&#x05DD;</span></div>';
    h+='<input type="range" min="1" max="60" value="'+dm+'" class="fs" oninput="uC(\''+id+'\','+pr+',this.value)">';
    h+='<div class="fr"><div class="fpm" id="fp-'+id+'">'+F(dp)+' &#8362; / &#x05D7;&#x05D5;&#x05D3;&#x05E9;</div><div class="ftot" id="ft-'+id+'">&#x05E1;&#x05D4;"&#x05DB;: '+F(dp*dm)+' &#8362;</div></div>';
    h+='</div>';

    h+='<div class="cb" onclick="op(\''+K[i]+'\')">&#x05DC;&#x05D7;&#x05E5; &#x05DC;&#x05E4;&#x05E8;&#x05D8;&#x05D9;&#x05DD;</div>';
    h+='</div></div>';
  }
  h+='</div>';c.className='';c.innerHTML=h;
});

function op(key){
  var car=AC[key];if(!car)return;
  mI=car.images||[];if(!mI.length&&car.image_url)mI=[car.image_url];mi=0;
  var pr=parseInt(car.price)||0,dm=36,dp=P(pr,dm,5);
  var h='<button class="mx" onclick="cl()">&#x2715;</button>';
  h+='<div class="mg"><img id="mimg" src="'+(mI[0]||'')+'">';
  if(mI.length>1){h+='<button class="ma r" onclick="ms(1)">&#8249;</button><button class="ma l" onclick="ms(-1)">&#8250;</button><div class="mcn" id="mcn">1 / '+mI.length+'</div>'}
  h+='</div>';
  if(mI.length>1){h+='<div class="mth" id="mth">';for(var i=0;i<mI.length;i++)h+='<img src="'+mI[i]+'" onclick="mg('+i+')" class="'+(i===0?'a':'')+'">'; h+='</div>'}
  h+='<div class="mbd">';
  h+='<div class="mn">'+(car.name||'')+'</div>';
  h+='<div class="mmg"><div class="mi"><div class="lb">&#x05E9;&#x05E0;&#x05D4;</div><div class="vl">'+(car.year||'')+'</div></div><div class="mi"><div class="lb">&#x05DE;&#x05E0;&#x05D5;&#x05E2;</div><div class="vl">'+(car.engine||'')+'</div></div><div class="mi"><div class="lb">&#x05E7;"&#x05DE;</div><div class="vl">'+F(car.km||0)+'</div></div></div>';
  if(car.description)h+='<div class="md">'+car.description+'</div>';
  h+='<div class="mp">'+F(pr)+' &#8362;</div>';
  h+='<div class="mfin"><h3>&#x05DE;&#x05D7;&#x05E9;&#x05D1;&#x05D5;&#x05DF; &#x05DE;&#x05D9;&#x05DE;&#x05D5;&#x05DF; (5% &#x05E8;&#x05D9;&#x05D1;&#x05D9;&#x05EA;)</h3>';
  h+='<div class="mfl2"><span>&#x05EA;&#x05E7;&#x05D5;&#x05E4;&#x05D4;</span><span id="mmn">'+dm+' &#x05D7;&#x05D5;&#x05D3;&#x05E9;&#x05D9;&#x05DD;</span></div>';
  h+='<input type="range" min="1" max="60" value="'+dm+'" class="ms2" id="msl" oninput="mc('+pr+')">';
  h+='<div class="mr2"><div class="mrm2" id="mpm">'+F(dp)+' &#8362; / &#x05D7;&#x05D5;&#x05D3;&#x05E9;</div><div class="mrt2" id="mtt">&#x05E1;&#x05D4;"&#x05DB;: '+F(dp*dm)+' &#8362;</div></div></div>';
  h+='<button class="mcta" onclick="alert(\'&#x05D1;&#x05E7;&#x05E8;&#x05D5;&#x05D1;\')">&#x05D0;&#x05E0;&#x05D9; &#x05DE;&#x05E2;&#x05D5;&#x05E0;&#x05D9;&#x05D9;&#x05DF; - &#x05E6;&#x05E8;&#x05D5; &#x05E7;&#x05E9;&#x05E8;</button>';
  h+='</div>';
  document.getElementById('ml').innerHTML=h;
  document.getElementById('ov').classList.add('active');
  document.body.classList.add('noscroll');
}
function cl(){document.getElementById('ov').classList.remove('active');document.body.classList.remove('noscroll')}
function ms(d){mi+=d;if(mi<0)mi=mI.length-1;if(mi>=mI.length)mi=0;mu()}
function mg(i){mi=i;mu()}
function mu(){document.getElementById('mimg').src=mI[mi];var c=document.getElementById('mcn');if(c)c.innerHTML=(mi+1)+' / '+mI.length;var t=document.querySelectorAll('#mth img');for(var i=0;i<t.length;i++)t[i].className=i===mi?'a':''}
function mc(pr){var m=parseInt(document.getElementById('msl').value),p=P(pr,m,5);document.getElementById('mpm').innerHTML=F(p)+' &#8362; / &#x05D7;&#x05D5;&#x05D3;&#x05E9;';document.getElementById('mmn').innerHTML=m+' &#x05D7;&#x05D5;&#x05D3;&#x05E9;&#x05D9;&#x05DD;';document.getElementById('mtt').innerHTML='&#x05E1;&#x05D4;"&#x05DB;: '+F(p*m)+' &#8362;'}
document.addEventListener('keydown',function(e){if(!document.getElementById('ov').classList.contains('active'))return;if(e.key==='Escape')cl();if(e.key==='ArrowRight')ms(-1);if(e.key==='ArrowLeft')ms(1)});
</script>
</body>
</html>
