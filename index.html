<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoFin</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Heebo',sans-serif;background:#F4F3EF;color:#0B1F3A;direction:rtl}
.nav{background:#0B1F3A;height:64px;display:flex;align-items:center;padding:0 2rem;position:sticky;top:0;z-index:100}
.logo{color:#C9A84C;font-size:1.6rem;font-weight:900}
.logo em{color:white;font-style:normal}
.wrap{max-width:1240px;margin:0 auto;padding:2rem}
h1{font-size:2rem;margin-bottom:2rem;font-weight:900}
.cars{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:2rem}
.car{background:white;border-radius:16px;overflow:hidden;border:1px solid #E0DEDA;transition:transform .2s,box-shadow .2s}
.car:hover{transform:translateY(-4px);box-shadow:0 8px 24px rgba(0,0,0,.08)}
.car-img{width:100%;height:220px;object-fit:cover;background:#ddd}
.car-info{padding:1.5rem}
.car-name{font-size:1.2rem;font-weight:800;margin-bottom:.4rem}
.car-meta{font-size:.85rem;color:#5A6A7E;margin-bottom:1rem}
.car-price{font-size:1.5rem;font-weight:900;color:#0B1F3A;margin-bottom:1.2rem}

.finance-box{background:#F4F3EF;border-radius:12px;padding:1rem 1.2rem}
.finance-label{font-size:.8rem;color:#5A6A7E;margin-bottom:.5rem;display:flex;justify-content:space-between}
.finance-slider{width:100%;-webkit-appearance:none;appearance:none;height:6px;background:#E0DEDA;border-radius:3px;outline:none;cursor:pointer}
.finance-slider::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#C9A84C;cursor:pointer;border:2px solid #0B1F3A}
.finance-result{display:flex;justify-content:space-between;align-items:center;margin-top:.8rem}
.monthly{font-size:1.3rem;font-weight:900;color:#C9A84C}
.months-display{font-size:.85rem;color:#5A6A7E}
.total-cost{font-size:.75rem;color:#999;margin-top:.3rem}

.loading{text-align:center;padding:4rem;font-size:1.2rem;color:#5A6A7E}
</style>
</head>
<body>
<nav class="nav">
  <div class="logo"><em>Auto</em>Fin</div>
</nav>

<div class="wrap">
  <h1>&#x1F697; &#x05E7;&#x05D8;&#x05DC;&#x05D5;&#x05D2; &#x05E8;&#x05DB;&#x05D1;&#x05D9;&#x05DD;</h1>
  <div id="cars" class="loading">&#x05D8;&#x05D5;&#x05E2;&#x05DF;...</div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script>
var firebaseConfig = {
  apiKey: "AIzaSyCUC4ConlLR7nONsqECFc_8S5_rO9oiwuQ",
  authDomain: "car-sales-7ddec.firebaseapp.com",
  databaseURL: "https://car-sales-7ddec-default-rtdb.firebaseio.com",
  projectId: "car-sales-7ddec",
  storageBucket: "car-sales-7ddec.firebasestorage.app",
  messagingSenderId: "360924922585",
  appId: "1:360924922585:web:0f18b076fff3e82460f4c8"
};

firebase.initializeApp(firebaseConfig);
var db = firebase.database();

function calcPMT(price, months, annualRate) {
  var r = annualRate / 100 / 12;
  if (r === 0) return price / months;
  return price * (r * Math.pow(1 + r, months)) / (Math.pow(1 + r, months) - 1);
}

function formatNum(n) {
  return Math.round(n).toLocaleString('he-IL');
}

db.ref('cars').on('value', function(snapshot) {
  var data = snapshot.val();
  var container = document.getElementById('cars');
  
  if (!data) {
    container.innerHTML = '<p style="text-align:center;color:#999;padding:3rem">&#x05D0;&#x05D9;&#x05DF; &#x05E8;&#x05DB;&#x05D1;&#x05D9;&#x05DD; &#x05D6;&#x05DE;&#x05D9;&#x05E0;&#x05D9;&#x05DD;</p>';
    return;
  }

  var html = '<div class="cars">';
  var keys = Object.keys(data);
  for (var i = 0; i < keys.length; i++) {
    var car = data[keys[i]];
    var id = keys[i];
    var price = parseInt(car.price) || 0;
    var name = car.name || '';
    var year = car.year || '';
    var engine = car.engine || '';
    var km = car.km || 0;
    var imgSrc = car.image_url || '';
    var defaultMonths = 36;
    var defaultPMT = calcPMT(price, defaultMonths, 5);
    var totalDefault = defaultPMT * defaultMonths;

    html += '<div class="car">';
    if (imgSrc) {
      html += '<img src="' + imgSrc + '" alt="' + name + '" class="car-img">';
    }
    html += '<div class="car-info">';
    html += '<div class="car-name">' + name + '</div>';
    html += '<div class="car-meta">' + year + ' &middot; ' + engine + ' &middot; ' + formatNum(km) + ' &#x05E7;"&#x05DE;</div>';
    html += '<div class="car-price">' + formatNum(price) + ' &#8362;</div>';
    
    html += '<div class="finance-box">';
    html += '<div class="finance-label"><span>&#x05DE;&#x05D9;&#x05DE;&#x05D5;&#x05DF; &#x05D7;&#x05D5;&#x05D3;&#x05E9;&#x05D9; (5% &#x05E8;&#x05D9;&#x05D1;&#x05D9;&#x05EA;)</span><span id="months-' + id + '">' + defaultMonths + ' &#x05D7;&#x05D5;&#x05D3;&#x05E9;&#x05D9;&#x05DD;</span></div>';
    html += '<input type="range" min="1" max="60" value="' + defaultMonths + '" class="finance-slider" oninput="updatePMT(\'' + id + '\',' + price + ',this.value)">';
    html += '<div class="finance-result">';
    html += '<div class="monthly" id="pmt-' + id + '">' + formatNum(defaultPMT) + ' &#8362; / &#x05D7;&#x05D5;&#x05D3;&#x05E9;</div>';
    html += '</div>';
    html += '<div class="total-cost" id="total-' + id + '">&#x05E1;&#x05D4;"&#x05DB; &#x05DC;&#x05EA;&#x05E9;&#x05DC;&#x05D5;&#x05DD;: ' + formatNum(totalDefault) + ' &#8362;</div>';
    html += '</div>';

    html += '</div></div>';
  }
  html += '</div>';

  container.className = '';
  container.innerHTML = html;
});

function updatePMT(id, price, months) {
  months = parseInt(months);
  var pmt = calcPMT(price, months, 5);
  var total = pmt * months;
  document.getElementById('pmt-' + id).innerHTML = formatNum(pmt) + ' &#8362; / &#x05D7;&#x05D5;&#x05D3;&#x05E9;';
  document.getElementById('months-' + id).innerHTML = months + ' &#x05D7;&#x05D5;&#x05D3;&#x05E9;&#x05D9;&#x05DD;';
  document.getElementById('total-' + id).innerHTML = '&#x05E1;&#x05D4;"&#x05DB; &#x05DC;&#x05EA;&#x05E9;&#x05DC;&#x05D5;&#x05DD;: ' + formatNum(total) + ' &#8362;';
}
</script>
</body>
</html>
