<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Heebo',sans-serif;background:#F4F3EF;color:#0B1F3A;direction:rtl}
body.noscroll{overflow:hidden}
.nav{background:linear-gradient(135deg,#0B1F3A 0%,#142d52 100%);height:64px;display:flex;align-items:center;padding:0 2rem;position:sticky;top:0;z-index:100;box-shadow:0 2px 20px rgba(0,0,0,.15)}
.logo{color:#C9A84C;font-size:1.6rem;font-weight:900;cursor:pointer;font-family:'Frank Ruhl Libre',serif}
.logo em{color:white;font-style:normal}
.wrap{max-width:1240px;margin:0 auto;padding:2rem}
h1{font-size:2rem;margin-bottom:2rem;font-weight:900;font-family:'Frank Ruhl Libre',serif}
.cars{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:2rem}
.car{background:white;border-radius:16px;overflow:hidden;border:1px solid #E0DEDA;transition:transform .3s,box-shadow .3s}
.car:hover{transform:translateY(-6px);box-shadow:0 12px 32px rgba(0,0,0,.12)}
.cg{position:relative;width:100%;height:220px;overflow:hidden;background:#ddd;cursor:pointer}
.cg img{width:100%;height:100%;object-fit:cover;display:block}
.ca{position:absolute;top:50%;transform:translateY(-50%);width:32px;height:32px;background:rgba(255,255,255,.85);border:none;border-radius:50%;cursor:pointer;font-size:16px;font-weight:bold;color:#0B1F3A;display:flex;align-items:center;justify-content:center;z-index:2;opacity:0;transition:opacity .2s}
.car:hover .ca{opacity:1}
.ca.r{right:8px}.ca.l{left:8px}
.cdots{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:4px;z-index:2}
.cdt{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.5);border:none;cursor:pointer;padding:0}.cdt.on{background:#C9A84C}
.ic{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.6);color:white;padding:2px 10px;border-radius:20px;font-size:.75rem;z-index:2}
.ci{padding:1.2rem}
.cn{font-size:1.15rem;font-weight:800;margin-bottom:.3rem;cursor:pointer}
.cmeta{font-size:.85rem;color:#5A6A7E;margin-bottom:.6rem}
.cprice{font-size:1.4rem;font-weight:900;color:#0B1F3A;margin-bottom:1rem}
.fb{background:#F4F3EF;border-radius:10px;padding:.8rem 1rem;margin-top:.5rem}
.fl{font-size:.75rem;color:#5A6A7E;margin-bottom:.4rem;display:flex;justify-content:space-between}
.fslider{width:100%;-webkit-appearance:none;appearance:none;height:5px;background:#E0DEDA;border-radius:3px;outline:none;cursor:pointer}
.fslider::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#C9A84C;cursor:pointer;border:2px solid #0B1F3A}
.frow{display:flex;justify-content:space-between;align-items:center;margin-top:.5rem}
.fpmt{font-size:1.15rem;font-weight:900;color:#C9A84C}
.ftot{font-size:.7rem;color:#999}
.cbadge{display:inline-block;background:#E8F5E9;color:#1A7A4A;padding:2px 10px;border-radius:20px;font-size:.75rem;font-weight:600;margin-top:.6rem;cursor:pointer}
.loading{text-align:center;padding:4rem;font-size:1.2rem;color:#5A6A7E}

/* ========== MODAL ========== */
.ov{display:none;position:fixed;inset:0;background:rgba(8,18,35,.55);z-index:1000;padding:16px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}

.ml{background:#fff;border-radius:20px;width:100%;max-width:660px;max-height:calc(100vh - 32px);display:flex;flex-direction:column;overflow:hidden;animation:mIn .4s cubic-bezier(.16,1,.3,1);position:relative;box-shadow:0 25px 80px rgba(0,0,0,.25),0 0 0 1px rgba(0,0,0,.05)}

.mg{position:relative;width:100%;height:300px;background:#111;overflow:hidden;flex-shrink:0}
.mg img{width:100%;height:100%;object-fit:cover;display:block;transition:opacity .3s}

.mthumbs img.a{opacity:1;border-color:#C9A84C;box-shadow:0 0 8px rgba(201,168,76,.25)}
.mthumbs img:hover{opacity:.7}

/* MODAL BODY */
.mbody{padding:1.2rem 1.4rem 1.4rem;overflow-y:auto;flex:1;background:#fff}

.mname{font-size:1.45rem;font-weight:900;font-family:'Frank Ruhl Libre',serif;margin-bottom:.8rem;color:#0B1F3A;animation:fu .4s ease both}

.mspecs{display:flex;gap:8px;margin-bottom:1rem;animation:fu .4s ease .05s both}

.mspec-icon{font-size:1rem;margin-bottom:.15rem}
.mspec-label{font-size:.58rem;color:#999;text-transform:uppercase;letter-spacing:.5px;margin-bottom:.1rem}
.mspec-val{font-size:.88rem;font-weight:700;color:#0B1F3A}

.mdesc{font-size:.88rem;line-height:1.7;color:#555;margin-bottom:1rem;padding:.8rem 1rem;background:#f9f9f7;border-radius:10px;border-right:3px solid #C9A84C;animation:fu .4s ease .1s both}

.mprice-row{display:flex;align-items:baseline;gap:.4rem;margin-bottom:1rem;animation:fu .4s ease .15s both}
.mprice-num{font-size:1.7rem;font-weight:900;font-family:'Frank Ruhl Libre',serif;color:#0B1F3A}
.mprice-curr{font-size:.9rem;color:#999}

/* FINANCE */
.mfin{background:#f7f7f5;border:1px solid #eee;border-radius:14px;padding:1rem;animation:fu .4s ease .2s both}
.mfin-title{font-size:.8rem;font-weight:600;color:#777;margin-bottom:.7rem}
.mfin-title span{color:#C9A84C;font-weight:700}
.mf-top{display:flex;justify-content:space-between;font-size:.75rem;color:#999;margin-bottom:.3rem}
.mfslider{width:100%;-webkit-appearance:none;appearance:none;height:5px;background:#E0DEDA;border-radius:3px;outline:none;cursor:pointer;margin-bottom:.7rem}
.mfslider::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:linear-gradient(135deg,#C9A84C,#e0c06a);cursor:pointer;border:2px solid white;box-shadow:0 2px 8px rgba(201,168,76,.4)}
.mf-result{display:flex;justify-content:space-between;align-items:center;padding:.6rem .8rem;background:white;border-radius:10px;border:1px solid #eee}
.mf-pmt{font-size:1.15rem;font-weight:900;color:#C9A84C}
.mf-tot{font-size:.7rem;color:#bbb}

/* CTA */
.mcta-wrap{display:flex;justify-content:center;margin-top:1.2rem;animation:fu .4s ease .25s both}
.mcta{display:inline-flex;align-items:center;gap:.5rem;padding:12px 32px;background:linear-gradient(135deg,#0B1F3A,#142d52);color:white;border:none;border-radius:50px;font-size:.9rem;font-weight:700;cursor:pointer;transition:all .25s;letter-spacing:.3px;box-shadow:0 4px 15px rgba(11,31,58,.25)}
.mcta:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(11,31,58,.35);background:linear-gradient(135deg,#142d52,#1a3a6a)}
.mcta:active{transform:translateY(0)}
.mcta-icon{font-size:1.1rem}

@keyframes fu{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

@media(max-width:768px){

  h1{font-size:1.5rem;margin-bottom:1.2rem}

  .ov{padding:8px}

  .mspec{padding:.45rem .3rem}
  .mspec-val{font-size:.8rem}
  .mcta{padding:11px 24px;font-size:.85rem}
}
</style>
