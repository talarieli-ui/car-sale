<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoFin</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Heebo',sans-serif;background:#f5f5f5;direction:rtl;padding:2rem}
.container{max-width:1200px;margin:0 auto}
h1{margin-bottom:2rem;color:#0b1f3a}
.cars{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:2rem}
.car{background:white;border-radius:12px;overflow:hidden;border:1px solid #ddd}
.car-img{width:100%;height:200px;object-fit:cover;background:#ccc}
.car-info{padding:1.5rem}
.car-name{font-size:1.1rem;font-weight:700;margin-bottom:.5rem}
.car-meta{font-size:.85rem;color:#666;margin-bottom:1rem}
.car-price{font-size:1.3rem;font-weight:900;color:#0b1f3a}
.loading{text-align:center;padding:3rem;color:#999}
</style>
</head>
<body>
<div class="container">
  <h1>&#x1F697; &#x05E7;&#x05D8;&#x05DC;&#x05D5;&#x05D2; &#x05E8;&#x05DB;&#x05D1;&#x05D9;&#x05DD;</h1>
  <div id="cars" class="cars loading">&#x05D8;&#x05D5;&#x05E2;&#x05DF;...</div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script>
var firebaseConfig = {
  apiKey: "AIzaSyCUC4ConlLR7nONsqECFc_8S5_rO9oiwuQ",
  authDomain: "car-sales-7ddec.firebaseapp.com",
  databaseURL: "https://car-sales-7ddec-default-rtdb.firebaseio.com",
  projectId: "car-sales-7ddec",
  storageBucket: "car-sales-7ddec.firebasestorage.app",
  messagingSenderId: "360924922585",
  appId: "1:360924922585:web:0f18b076fff3e82460f4c8"
};

firebase.initializeApp(firebaseConfig);
var db = firebase.database();

db.ref('cars').on('value', function(snapshot) {
  var data = snapshot.val();
  var container = document.getElementById('cars');
  
  if (!data) {
    container.innerHTML = '<p style="grid-column:1/-1;text-align:center">No cars yet</p>';
    return;
  }

  var html = '';
  var keys = Object.keys(data);
  for (var i = 0; i < keys.length; i++) {
    var car = data[keys[i]];
    var imgSrc = car.image_url || '';
    var name = car.name || '';
    var year = car.year || '';
    var engine = car.engine || '';
    var km = car.km || 0;
    var price = parseInt(car.price) || 0;
    
    html += '<div class="car">';
    if (imgSrc) {
      html += '<img src="' + imgSrc + '" alt="' + name + '" class="car-img">';
    }
    html += '<div class="car-info">';
    html += '<div class="car-name">' + name + '</div>';
    html += '<div class="car-meta">' + year + ' &middot; ' + engine + ' &middot; ' + km + ' km</div>';
    html += '<div class="car-price">' + price.toLocaleString('he-IL') + ' &#8362;</div>';
    html += '</div></div>';
  }
  
  container.classList.remove('loading');
  container.innerHTML = html;
});
</script>
</body>
</html>
