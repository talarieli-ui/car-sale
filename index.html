<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoFin</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Heebo',sans-serif;background:#F4F3EF;color:#0B1F3A;direction:rtl}
body.no-scroll{overflow:hidden}
.nav{background:#0B1F3A;height:64px;display:flex;align-items:center;padding:0 2rem;position:sticky;top:0;z-index:100}
.logo{color:#C9A84C;font-size:1.6rem;font-weight:900;cursor:pointer}
.logo em{color:white;font-style:normal}
.wrap{max-width:1240px;margin:0 auto;padding:2rem}
h1{font-size:2rem;margin-bottom:2rem;font-weight:900}
.cars{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:2rem}

.car{background:white;border-radius:16px;overflow:hidden;border:1px solid #E0DEDA;transition:transform .3s,box-shadow .3s;cursor:pointer}
.car:hover{transform:translateY(-6px);box-shadow:0 12px 32px rgba(0,0,0,.12)}
.card-gallery{position:relative;width:100%;height:220px;overflow:hidden;background:#ddd}
.card-gallery img{width:100%;height:100%;object-fit:cover;display:block}
.card-arrow{position:absolute;top:50%;transform:translateY(-50%);width:32px;height:32px;background:rgba(255,255,255,.85);border:none;border-radius:50%;cursor:pointer;font-size:16px;font-weight:bold;color:#0B1F3A;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.15);z-index:2;opacity:0;transition:opacity .2s}
.car:hover .card-arrow{opacity:1}
.card-arrow.r{right:8px}.card-arrow.l{left:8px}
.card-dots{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:4px;z-index:2}
.card-dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.5);border:none;cursor:pointer;padding:0}.card-dot.on{background:#C9A84C}
.img-count{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.6);color:white;padding:2px 10px;border-radius:20px;font-size:.75rem;z-index:2}
.car-info{padding:1.5rem}
.car-name{font-size:1.2rem;font-weight:800;margin-bottom:.4rem}
.car-meta{font-size:.85rem;color:#5A6A7E;margin-bottom:.8rem}
.car-price{font-size:1.5rem;font-weight:900;color:#0B1F3A}
.car-badge{display:inline-block;background:#E8F5E9;color:#1A7A4A;padding:2px 10px;border-radius:20px;font-size:.75rem;font-weight:600;margin-top:.5rem}
.loading{text-align:center;padding:4rem;font-size:1.2rem;color:#5A6A7E}

/* MODAL OVERLAY */
.mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:1000;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:24px}
.mo.active{display:flex;justify-content:center;align-items:flex-start}

/* MODAL BOX */
.mb{background:white;border-radius:16px;width:100%;max-width:700px;margin:auto;overflow:hidden;animation:mIn .35s ease;position:relative}
@keyframes mIn{from{opacity:0;transform:scale(.96) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}

.mx{position:absolute;top:10px;right:10px;width:34px;height:34px;background:rgba(0,0,0,.5);border:none;border-radius:50%;color:white;font-size:18px;cursor:pointer;z-index:10;display:flex;align-items:center;justify-content:center}
.mx:hover{background:rgba(0,0,0,.8)}

/* MODAL GALLERY */
.mg{position:relative;width:100%;aspect-ratio:16/10;background:#222;overflow:hidden}
.mg img{width:100%;height:100%;object-fit:cover;display:block}
.ma{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;background:rgba(255,255,255,.9);border:none;border-radius:50%;cursor:pointer;font-size:18px;font-weight:bold;color:#0B1F3A;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.2);z-index:5}
.ma:hover{transform:translateY(-50%) scale(1.1)}
.ma.r{right:10px}.ma.l{left:10px}
.mc{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.55);color:white;padding:3px 12px;border-radius:16px;font-size:.8rem}
.mt{display:flex;gap:5px;padding:8px 10px;background:#f0f0f0;overflow-x:auto}
.mt img{width:56px;height:42px;object-fit:cover;border-radius:5px;cursor:pointer;opacity:.4;transition:all .2s;border:2px solid transparent;flex-shrink:0}
.mt img.a{opacity:1;border-color:#C9A84C}.mt img:hover{opacity:.7}

/* MODAL BODY */
.mbd{padding:1.2rem 1.5rem 1.5rem}
.mn{font-size:1.4rem;font-weight:900;margin-bottom:.6rem;animation:fu .4s ease .1s both}
.mmg{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin-bottom:1rem;animation:fu .4s ease .15s both}
.mi{background:#F4F3EF;border-radius:10px;padding:.7rem;text-align:center}
.mi .lb{font-size:.7rem;color:#5A6A7E;margin-bottom:.15rem}
.mi .vl{font-size:.95rem;font-weight:700}
.md{font-size:.9rem;line-height:1.7;color:#444;margin-bottom:1rem;padding:.9rem;background:#FAFAFA;border-radius:10px;border-right:3px solid #C9A84C;animation:fu .4s ease .2s both}
.mp{font-size:1.6rem;font-weight:900;color:#0B1F3A;margin-bottom:1rem;animation:fu .4s ease .25s both}

.mf{background:#F4F3EF;border-radius:12px;padding:1rem;animation:fu .4s ease .3s both}
.mf h3{font-size:.95rem;font-weight:700;margin-bottom:.6rem}
.mfl{font-size:.8rem;color:#5A6A7E;margin-bottom:.4rem;display:flex;justify-content:space-between}
.ms{width:100%;-webkit-appearance:none;appearance:none;height:6px;background:#E0DEDA;border-radius:3px;outline:none;cursor:pointer;margin-bottom:.6rem}
.ms::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#C9A84C;cursor:pointer;border:2px solid #0B1F3A}
.mr{display:flex;justify-content:space-between;align-items:center;padding:.7rem;background:white;border-radius:8px}
.mrm{font-size:1.2rem;font-weight:900;color:#C9A84C}
.mrt{font-size:.75rem;color:#999}

.mcta{width:100%;padding:13px;background:#C9A84C;color:#0B1F3A;border:none;border-radius:10px;font-size:1rem;font-weight:800;cursor:pointer;margin-top:1rem;transition:all .2s;animation:fu .4s ease .35s both}
.mcta:hover{background:#d9b558;transform:scale(1.02)}

@keyframes fu{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

@media(max-width:768px){
  .wrap{padding:1rem}
  h1{font-size:1.5rem;margin-bottom:1.2rem}
  .cars{grid-template-columns:1fr;gap:1.2rem}
  .mo{padding:12px}
  .mb{border-radius:12px}
  .mg{aspect-ratio:16/10}
  .mmg{gap:.5rem}
  .mi{padding:.5rem .3rem}
  .mi .vl{font-size:.85rem}
  .mbd{padding:1rem}
  .mn{font-size:1.2rem}
  .mp{font-size:1.4rem}
  .mt img{width:48px;height:36px}
}
</style>
</head>
<body>
<nav class="nav"><div class="logo" onclick="location.reload()"><em>Auto</em>Fin</div></nav>
<div class="wrap">
  <h1>&#x1F697; &#x05E7;&#x05D8;&#x05DC;&#x05D5;&#x05D2; &#x05E8;&#x05DB;&#x05D1;&#x05D9;&#x05DD;</h1>
  <div id="cars" class="loading">&#x05D8;&#x05D5;&#x05E2;&#x05DF;...</div>
</div>
<div class="mo" id="mo" onclick="if(event.target===this)cl()"><div class="mb" id="mb"></div></div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script>
firebase.initializeApp({apiKey:"AIzaSyCUC4ConlLR7nONsqECFc_8S5_rO9oiwuQ",authDomain:"car-sales-7ddec.firebaseapp.com",databaseURL:"https://car-sales-7ddec-default-rtdb.firebaseio.com",projectId:"car-sales-7ddec",storageBucket:"car-sales-7ddec.firebasestorage.app",messagingSenderId:"360924922585",appId:"1:360924922585:web:0f18b076fff3e82460f4c8"});
var db=firebase.database(),AC={},CS={},mi=0,mI=[];

function F(n){return Math.round(n).toLocaleString('he-IL')}
function P(p,m,r){var i=r/100/12;return i===0?p/m:p*(i*Math.pow(1+i,m))/(Math.pow(1+i,m)-1)}

function cS(id,d,e){e.stopPropagation();var s=CS[id];if(!s)return;s.i+=d;if(s.i<0)s.i=s.g.length-1;if(s.i>=s.g.length)s.i=0;document.getElementById('ci-'+id).src=s.g[s.i];var dots=document.querySelectorAll('.cd-'+id+' .card-dot');for(var j=0;j<dots.length;j++){dots[j].className=j===s.i?'card-dot on':'card-dot'}}

db.ref('cars').on('value',function(snap){
  var data=snap.val(),c=document.getElementById('cars');
  if(!data){c.innerHTML='<p style="text-align:center;color:#999;padding:3rem">&#x05D0;&#x05D9;&#x05DF; &#x05E8;&#x05DB;&#x05D1;&#x05D9;&#x05DD;</p>';return}
  AC=data;var h='<div class="cars">',K=Object.keys(data);
  for(var i=0;i<K.length;i++){
    var car=data[K[i]],id=K[i].replace(/[^a-zA-Z0-9]/g,''),imgs=car.images||[];
    if(!imgs.length&&car.image_url)imgs=[car.image_url];
    CS[id]={i:0,g:imgs};var pr=parseInt(car.price)||0;
    h+='<div class="car" onclick="op(\''+K[i]+'\')">';
    h+='<div class="card-gallery">';
    if(imgs.length)h+='<img id="ci-'+id+'" src="'+imgs[0]+'" alt="">';
    if(imgs.length>1){
      h+='<button class="card-arrow r" onclick="cS(\''+id+'\',1,event)">&#8249;</button>';
      h+='<button class="card-arrow l" onclick="cS(\''+id+'\',-1,event)">&#8250;</button>';
      h+='<span class="img-count">'+imgs.length+' &#x05EA;&#x05DE;&#x05D5;&#x05E0;&#x05D5;&#x05EA;</span>';
      h+='<div class="card-dots cd-'+id+'">';
      for(var d=0;d<imgs.length;d++)h+='<button class="card-dot'+(d===0?' on':'')+'" onclick="event.stopPropagation()"></button>';
      h+='</div>';
    }
    h+='</div><div class="car-info">';
    h+='<div class="car-name">'+(car.name||'')+'</div>';
    h+='<div class="car-meta">'+(car.year||'')+' &middot; '+(car.engine||'')+' &middot; '+F(car.km||0)+' &#x05E7;"&#x05DE;</div>';
    h+='<div class="car-price">'+F(pr)+' &#8362;</div>';
    h+='<div class="car-badge">&#x05DC;&#x05D7;&#x05E5; &#x05DC;&#x05E4;&#x05E8;&#x05D8;&#x05D9;&#x05DD;</div>';
    h+='</div></div>';
  }
  h+='</div>';c.className='';c.innerHTML=h;
});

function op(key){
  var car=AC[key];if(!car)return;
  mI=car.images||[];if(!mI.length&&car.image_url)mI=[car.image_url];mi=0;
  var pr=parseInt(car.price)||0,dm=36,dp=P(pr,dm,5);
  var h='<button class="mx" onclick="cl()">&#x2715;</button>';
  h+='<div class="mg"><img id="mimg" src="'+(mI[0]||'')+'">';
  if(mI.length>1){h+='<button class="ma r" onclick="ms(1)">&#8249;</button><button class="ma l" onclick="ms(-1)">&#8250;</button><div class="mc" id="mcn">1 / '+mI.length+'</div>'}
  h+='</div>';
  if(mI.length>1){h+='<div class="mt" id="mth">';for(var i=0;i<mI.length;i++)h+='<img src="'+mI[i]+'" onclick="mg('+i+')" class="'+(i===0?'a':'')+'">'; h+='</div>'}
  h+='<div class="mbd">';
  h+='<div class="mn">'+(car.name||'')+'</div>';
  h+='<div class="mmg"><div class="mi"><div class="lb">&#x05E9;&#x05E0;&#x05D4;</div><div class="vl">'+(car.year||'')+'</div></div><div class="mi"><div class="lb">&#x05DE;&#x05E0;&#x05D5;&#x05E2;</div><div class="vl">'+(car.engine||'')+'</div></div><div class="mi"><div class="lb">&#x05E7;"&#x05DE;</div><div class="vl">'+F(car.km||0)+'</div></div></div>';
  if(car.description)h+='<div class="md">'+car.description+'</div>';
  h+='<div class="mp">'+F(pr)+' &#8362;</div>';
  h+='<div class="mf"><h3>&#x05DE;&#x05D7;&#x05E9;&#x05D1;&#x05D5;&#x05DF; &#x05DE;&#x05D9;&#x05DE;&#x05D5;&#x05DF; (5% &#x05E8;&#x05D9;&#x05D1;&#x05D9;&#x05EA;)</h3>';
  h+='<div class="mfl"><span>&#x05EA;&#x05E7;&#x05D5;&#x05E4;&#x05D4;</span><span id="mmn">'+dm+' &#x05D7;&#x05D5;&#x05D3;&#x05E9;&#x05D9;&#x05DD;</span></div>';
  h+='<input type="range" min="1" max="60" value="'+dm+'" class="ms" id="msl" oninput="mc('+pr+')">';
  h+='<div class="mr"><div class="mrm" id="mpm">'+F(dp)+' &#8362; / &#x05D7;&#x05D5;&#x05D3;&#x05E9;</div><div class="mrt" id="mtt">&#x05E1;&#x05D4;"&#x05DB;: '+F(dp*dm)+' &#8362;</div></div></div>';
  h+='<button class="mcta" onclick="alert(\'&#x05D1;&#x05E7;&#x05E8;&#x05D5;&#x05D1;\')">&#x05D0;&#x05E0;&#x05D9; &#x05DE;&#x05E2;&#x05D5;&#x05E0;&#x05D9;&#x05D9;&#x05DF; - &#x05E6;&#x05E8;&#x05D5; &#x05E7;&#x05E9;&#x05E8;</button>';
  h+='</div>';
  document.getElementById('mb').innerHTML=h;
  document.getElementById('mo').classList.add('active');
  document.body.classList.add('no-scroll');
  document.getElementById('mo').scrollTop=0;
}

function cl(){document.getElementById('mo').classList.remove('active');document.body.classList.remove('no-scroll')}
function ms(d){mi+=d;if(mi<0)mi=mI.length-1;if(mi>=mI.length)mi=0;mu()}
function mg(i){mi=i;mu()}
function mu(){document.getElementById('mimg').src=mI[mi];var c=document.getElementById('mcn');if(c)c.innerHTML=(mi+1)+' / '+mI.length;var t=document.querySelectorAll('#mth img');for(var i=0;i<t.length;i++)t[i].className=i===mi?'a':''}
function mc(pr){var m=parseInt(document.getElementById('msl').value),p=P(pr,m,5);document.getElementById('mpm').innerHTML=F(p)+' &#8362; / &#x05D7;&#x05D5;&#x05D3;&#x05E9;';document.getElementById('mmn').innerHTML=m+' &#x05D7;&#x05D5;&#x05D3;&#x05E9;&#x05D9;&#x05DD;';document.getElementById('mtt').innerHTML='&#x05E1;&#x05D4;"&#x05DB;: '+F(p*m)+' &#8362;'}
document.addEventListener('keydown',function(e){if(!document.getElementById('mo').classList.contains('active'))return;if(e.key==='Escape')cl();if(e.key==='ArrowRight')ms(-1);if(e.key==='ArrowLeft')ms(1)});
</script>
</body>
</html>
