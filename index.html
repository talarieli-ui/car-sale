.mcta-call:hover{background:#f5f5f5;transform:translateY(-1px)}
.mcta-icon{font-size:.95rem}

@keyframes fu{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

@media(max-width:768px){

  .mspec{padding:.45rem .3rem}
  .mspec-val{font-size:.8rem}
  .mcta{padding:11px 24px;font-size:.85rem}
}
</style>

    h+='<div class="tip-row"><div class="tip-icon">\uD83D\uDCB0</div>\u05E2\u05D3 100% \u05DE\u05D9\u05DE\u05D5\u05DF \u05D1\u05EA\u05E0\u05D0\u05D9\u05DD \u05E0\u05D5\u05D7\u05D9\u05DD</div>';
    h+='</div></div>';
    h+='<div class="card-cta"><button class="card-btn-wa" onclick="event.stopPropagation();sendWA(\''+(car.name||'').replace(/'/g,"\\'")+'\')">\uD83D\uDCF2 WhatsApp</button><a href="tel:0559895320" class="card-btn-call" onclick="event.stopPropagation()">\uD83D\uDCDE \u05D4\u05EA\u05E7\u05E9\u05E8\u05D5</a></div>';
    h+='</div></div>';
  }
  h+='</div>';c.className='';c.innerHTML=h;
});

function op(key){
  var car=AC[key];if(!car)return;
  mI=car.images||[];if(!mI.length&&car.image_url)mI=[car.image_url];mi=0;
  var pr=parseInt(car.price)||0,dm=36,dp=P(pr,dm);
  var carName=car.name||'';
  var h='<button class="mx" onclick="cl()">\u2715</button>';
  h+='<div class="mg"><img id="mimg" src="'+(mI[0]||'')+'">';
  if(mI.length>1){h+='<button class="mga r" onclick="ms(1)">\u203A</button><button class="mga l" onclick="ms(-1)">\u2039</button><div class="mcounter" id="mcn">1 / '+mI.length+'</div>'}
  h+='</div>';
  if(mI.length>1){h+='<div class="mthumbs" id="mth">';for(var i=0;i<mI.length;i++)h+='<img src="'+mI[i]+'" onclick="mg('+i+')" class="'+(i===0?'a':'')+'">'; h+='</div>'}
  h+='<div class="mbody">';
  h+='<div class="mname">'+carName+'</div>';
  h+='<div class="mspecs">';
  h+='<div class="mspec"><div class="mspec-icon">\uD83D\uDCC5</div><div class="mspec-label">\u05E9\u05E0\u05D4</div><div class="mspec-val">'+(car.year||'')+'</div></div>';
  h+='<div class="mspec"><div class="mspec-icon">\u2699\uFE0F</div><div class="mspec-label">\u05DE\u05E0\u05D5\u05E2</div><div class="mspec-val">'+(car.engine||'')+'</div></div>';
  h+='<div class="mspec"><div class="mspec-icon">\uD83D\uDEE3\uFE0F</div><div class="mspec-label">\u05E7\u05D9\u05DC\u05D5\u05DE\u05D8\u05E8\u05D6</div><div class="mspec-val">'+F(car.km||0)+'</div></div>';
  h+='</div>';

  if(car.description)h+='<div class="mdesc">'+car.description+'</div>';
  h+='<div class="mprice-row"><div class="mprice-num">'+F(pr)+'</div><div class="mprice-curr">\u20AA</div></div>';
  h+='<div class="mfin"><div class="mfin-title">\uD83D\uDCB0 \u05DE\u05D7\u05E9\u05D1\u05D5\u05DF \u05DE\u05D9\u05DE\u05D5\u05DF</div>';
  h+='<div class="mf-top"><span>\u05EA\u05E7\u05D5\u05E4\u05D4</span><span id="mmn">'+dm+' \u05D7\u05D5\u05D3\u05E9\u05D9\u05DD</span></div>';
  h+='<input type="range" min="1" max="60" value="'+dm+'" class="mfslider" id="msl" oninput="mc('+pr+')">';
  h+='<div class="mf-result"><div class="mf-pmt" id="mpm">'+F(dp)+' \u20AA / \u05D7\u05D5\u05D3\u05E9</div></div></div>';
  h+='</div>';
  h+='<div class="mcta-foot"><button class="mcta" onclick="sendWA(\''+carName.replace(/'/g,"\\'")+'\')"><span class="mcta-icon">\uD83D\uDCF2</span> WhatsApp</button><a href="tel:0559895320" class="mcta-call" onclick="event.stopPropagation()"><span class="mcta-icon">\uD83D\uDCDE</span> \u05D4\u05EA\u05E7\u05E9\u05E8\u05D5</a></div>';
  
  document.getElementById('ml').innerHTML=h;
  document.getElementById('ov').classList.add('active');
  document.body.classList.add('noscroll');
}
function cl(){document.getElementById('ov').classList.remove('active');document.body.classList.remove('noscroll')}
function ms(d){mi+=d;if(mi<0)mi=mI.length-1;if(mi>=mI.length)mi=0;mu()}
function mg(i){mi=i;mu()}
function mu(){document.getElementById('mimg').src=mI[mi];var c=document.getElementById('mcn');if(c)c.innerHTML=(mi+1)+' / '+mI.length;var t=document.querySelectorAll('#mth img');for(var i=0;i<t.length;i++)t[i].className=i===mi?'a':''}
function mc(pr){
  var m=parseInt(document.getElementById('msl').value),p=P(pr,m),t=T(pr,m);
  document.getElementById('mpm').innerHTML=F(p)+' \u20AA / \u05D7\u05D5\u05D3\u05E9';
  document.getElementById('mmn').innerHTML=m===1?'\u05EA\u05E9\u05DC\u05D5\u05DD \u05D0\u05D7\u05D3':m+' \u05D7\u05D5\u05D3\u05E9\u05D9\u05DD';
  
}
document.addEventListener('keydown',function(e){if(!document.getElementById('ov').classList.contains('active'))return;if(e.key==='Escape')cl();if(e.key==='ArrowRight')ms(-1);if(e.key==='ArrowLeft')ms(1)});
</script>
